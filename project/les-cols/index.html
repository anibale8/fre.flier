  <script src="https://cdn.jsdelivr.net/npm/panzoom@9.4.0/dist/panzoom.min.js"></script>
  <script>
    // Zoom on project photos with mouse wheel and pinch
    const photo = document.getElementById('project-photo');
    if (photo && typeof Panzoom !== 'undefined') {
      photo.style.cursor = 'grab';
      const pz = Panzoom(photo, {
        maxZoom: 4,
        minZoom: 1,
        contain: 'outside',
        canvas: true
      });
      photo.addEventListener('wheel', (e) => {
        e.preventDefault();
        pz.zoomWithWheel(e);
      }, { passive: false });
      // Reset zoom when changing photos
      const observer = new MutationObserver(() => pz.reset());
      observer.observe(photo, { attributes: true, attributeFilter: ['src'] });
    }
  </script>
